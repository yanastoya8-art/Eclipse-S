name: Cloudflare Share Worker

on:
  push:
    paths:
      - "cloudflare-share/**"
      - ".github/workflows/cloudflare-share.yml"
  pull_request:
    paths:
      - "cloudflare-share/**"
      - ".github/workflows/cloudflare-share.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-share
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-share/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
