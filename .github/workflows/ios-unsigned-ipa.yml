name: iOS Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Display name for this unsigned build. Empty uses IOS_APP_NAME repo variable, then Eclipse."
        required: false
        default: ""
      bundle_identifier:
        description: "Bundle ID for this unsigned build. Empty uses IOS_BUNDLE_IDENTIFIER repo variable, then app.Eclipse.Soupy."
        required: false
        default: ""
      release_version:
        description: "GitHub updater release version stamped into the app. Empty uses Build.xcconfig."
        required: false
        default: ""

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Validate default branch
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Unsigned IPA builds are allowed only from the default branch 'refs/heads/$DEFAULT_BRANCH'; received '$RELEASE_REF'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate immutable MPVKit revision
        env:
          MPVKIT_SOURCE_REVISION: 0c70f09fe9307eff8d972f824eeb58caf1381953
        run: |
          set -euo pipefail

          if ! [[ "$MPVKIT_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::MPVKIT_SOURCE_REVISION must be an explicitly reviewed lowercase 40-character commit SHA. Mutable MPVKit branches are not accepted."
            exit 1
          fi
      - name: Checkout pinned Eclipse MPVKit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: yanastoya8-art/MPVKit-S
          ref: 0c70f09fe9307eff8d972f824eeb58caf1381953
          path: MPVKit
      - name: Verify immutable MPVKit checkout
        env:
          MPVKIT_SOURCE_REVISION: 0c70f09fe9307eff8d972f824eeb58caf1381953
        run: test "$(git -C MPVKit rev-parse HEAD)" = "$MPVKIT_SOURCE_REVISION"
      - name: Expose sibling MPVKit package
        run: ln -sfn "$GITHUB_WORKSPACE/MPVKit" "$GITHUB_WORKSPACE/../MPVKit"

      - name: Build patched MPVKit for iPhone and iPad
        run: |
          set -euo pipefail
          brew install autoconf automake libtool ninja nasm
          MPVKIT_BUILD_VENV="$RUNNER_TEMP/mpvkit-build-venv"
          python3 -m venv "$MPVKIT_BUILD_VENV"
          "$MPVKIT_BUILD_VENV/bin/python" -m pip install --disable-pip-version-check meson==1.4.2
          export PATH="$MPVKIT_BUILD_VENV/bin:$PATH"
          make -C MPVKit build enable-gpl version=0.41.0 platform=ios
          test -f MPVKit/dist/release/Package.swift
          echo "MPVKIT_LOCAL_ARTIFACTS_DIR=$GITHUB_WORKSPACE/MPVKit/dist/release" >> "$GITHUB_ENV"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Resolve unsigned build settings
        env:
          INPUT_APP_NAME: ${{ inputs.app_name }}
          INPUT_BUNDLE_IDENTIFIER: ${{ inputs.bundle_identifier }}
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          VARIABLE_APP_NAME: ${{ vars.IOS_APP_NAME }}
          VARIABLE_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
          VARIABLE_DEVELOPMENT_TEAM: ${{ vars.IOS_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail

          APP_NAME="${INPUT_APP_NAME:-${VARIABLE_APP_NAME:-Eclipse}}"
          BUNDLE_IDENTIFIER="${INPUT_BUNDLE_IDENTIFIER:-${VARIABLE_BUNDLE_IDENTIFIER:-app.Eclipse.Soupy}}"
          DEVELOPMENT_TEAM="${VARIABLE_DEVELOPMENT_TEAM:-ANMK3Y568U}"
          RELEASE_VERSION="${INPUT_RELEASE_VERSION:-}"

          if ! [[ "$BUNDLE_IDENTIFIER" =~ ^[A-Za-z0-9][A-Za-z0-9-]*(\.[A-Za-z0-9][A-Za-z0-9-]*)+$ ]]; then
            echo "::error::Bundle identifier '$BUNDLE_IDENTIFIER' does not look valid. Example: com.yourname.eclipse"
            exit 1
          fi

          if [ -n "$RELEASE_VERSION" ] && ! [[ "$RELEASE_VERSION" =~ ^v?[0-9]+([.][0-9]+){0,3}([.-][A-Za-z0-9]+)*$ ]]; then
            echo "::error::Release version '$RELEASE_VERSION' does not look valid. Example: 2.0.0 or v2.0.0"
            exit 1
          fi

          {
            echo "APP_NAME=$APP_NAME"
            echo "BUNDLE_IDENTIFIER=$BUNDLE_IDENTIFIER"
            echo "DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM"
            echo "RELEASE_VERSION=$RELEASE_VERSION"
          } >> "$GITHUB_ENV"

      - name: Create local build config
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ANIMESCHEDULE_API_TOKEN: ${{ secrets.ANIMESCHEDULE_API_TOKEN }}
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          ANILIST_CLIENT_SECRET: ${{ secrets.ANILIST_CLIENT_SECRET }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TMDB_API_KEY:-}" ]; then
            echo "::error::TMDB_API_KEY is required. Add it under Repository Settings > Secrets and variables > Actions, then rerun the IPA workflow. Refusing to package an app that cannot load TMDB catalogs."
            exit 1
          fi

          for name in ANIMESCHEDULE_API_TOKEN ANILIST_CLIENT_ID ANILIST_CLIENT_SECRET TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET MAL_CLIENT_ID MAL_CLIENT_SECRET SIMKL_CLIENT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::warning::$name is not configured in GitHub Actions secrets; related optional features may be unavailable"
            fi
          done

          {
            printf 'APP_NAME = %s\n' "$APP_NAME"
            printf 'BUNDLE_IDENTIFIER = %s\n' "$BUNDLE_IDENTIFIER"
            printf 'DEVELOPMENT_TEAM = %s\n' "$DEVELOPMENT_TEAM"
            if [ -n "${RELEASE_VERSION:-}" ]; then
              printf 'ECLIPSE_RELEASE_VERSION = %s\n' "$RELEASE_VERSION"
            fi
            printf '%s\n' 'CODE_SIGN_ENTITLEMENTS ='
            printf '%s\n' 'ICLOUD_CONTAINER_ID ='
            printf 'TMDB_API_KEY = %s\n' "${TMDB_API_KEY:-}"
            printf 'ANIMESCHEDULE_API_TOKEN = %s\n' "${ANIMESCHEDULE_API_TOKEN:-}"
            printf 'ANILIST_CLIENT_ID = %s\n' "${ANILIST_CLIENT_ID:-}"
            printf 'ANILIST_CLIENT_SECRET = %s\n' "${ANILIST_CLIENT_SECRET:-}"
            printf '%s\n' 'ANILIST_REDIRECT_URI = luna:/$()/anilist-callback'
            printf 'TRAKT_CLIENT_ID = %s\n' "${TRAKT_CLIENT_ID:-}"
            printf 'TRAKT_CLIENT_SECRET = %s\n' "${TRAKT_CLIENT_SECRET:-}"
            printf '%s\n' 'TRAKT_REDIRECT_URI = luna:/$()/trakt-callback'
            printf 'MAL_CLIENT_ID = %s\n' "${MAL_CLIENT_ID:-}"
            printf 'MAL_CLIENT_SECRET = %s\n' "${MAL_CLIENT_SECRET:-}"
            printf 'SIMKL_CLIENT_ID = %s\n' "${SIMKL_CLIENT_ID:-}"
            printf '%s\n' 'MAL_REDIRECT_URI = luna:/$()/mal-callback'
          } > Build.local.xcconfig

      - name: Resolve Swift packages
        run: |
          set -euo pipefail

          SOURCE_PACKAGES_DIR="$RUNNER_TEMP/SourcePackages"
          rm -rf "$SOURCE_PACKAGES_DIR"
          xcodebuild -resolvePackageDependencies \
            -project Eclipse.xcodeproj \
            -scheme Eclipse \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -skipPackagePluginValidation \
            -skipMacroValidation

          # Published MPVKit 0.41.1 binaries predate the Apple PiP ABI exports.
          # The pinned MPVKit source supplies weak, safe fallback implementations and
          # linker-visible symbol providers in its _MPVKit-GPL target. Validate that
          # reviewed bridge source instead of incorrectly requiring the symbols inside
          # the prebuilt Libmpv.xcframework itself.
          BRIDGE_SOURCE="MPVKit/Sources/_MPVKit-GPL/dummy.c"
          BRIDGE_HEADER="MPVKit/Sources/_MPVKit-GPL/include/dummy.h"
          test -f "$BRIDGE_SOURCE"
          test -f "$BRIDGE_HEADER"
          python3 - "$BRIDGE_SOURCE" "$BRIDGE_HEADER" <<'PY'
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1]).read_text()
          header = pathlib.Path(sys.argv[2]).read_text()
          symbols = [
              "mpv_apple_pip_api_version",
              "mpv_apple_pip_get_capabilities",
              "mpv_apple_pip_set_callback",
              "mpv_apple_pip_set_mode",
              "mpv_apple_pip_submit_target",
              "mpv_apple_pip_disable_and_drain",
              "mpv_apple_audiounit_recovery_count",
          ]
          for symbol in symbols:
              if f"MPVKIT_WEAK_FALLBACK" not in source or symbol not in source:
                  raise SystemExit(f"Missing reviewed MPVKit weak fallback: {symbol}")
              provider = f"mpvkit_{symbol.removeprefix('mpv_')}_symbol"
              if provider not in source or provider not in header:
                  raise SystemExit(f"Missing linker-visible MPVKit symbol provider: {provider}")
          print("Reviewed MPVKit Apple PiP weak bridge validated.")
          PY

          echo "SOURCE_PACKAGES_DIR=$SOURCE_PACKAGES_DIR" >> "$GITHUB_ENV"
          echo "Using local MPVKit checkout: $(git -C MPVKit rev-parse HEAD)"

      - name: Build unsigned archive
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/$APP_NAME.xcarchive"
          DERIVED_DATA_PATH="$RUNNER_TEMP/DerivedData"
          MPVKIT_SOURCE_REVISION="$(git -C "$GITHUB_WORKSPACE/MPVKit" rev-parse HEAD)"

          rm -rf "$ARCHIVE_PATH" "$DERIVED_DATA_PATH"

          xcodebuild archive \
            -project Eclipse.xcodeproj \
            -scheme Eclipse \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            ECLIPSE_SOURCE_REVISION="$GITHUB_SHA" \
            ECLIPSE_MPVKIT_SOURCE_REVISION="$MPVKIT_SOURCE_REVISION" \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) ECLIPSE_UNSIGNED_BUILD' \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

          APP_PATH="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"

          test -f "$APP_PATH/OpenSourceLicenses/THIRD-PARTY-NOTICES.txt"
          test "$(/usr/libexec/PlistBuddy -c 'Print EclipseSourceRevision' "$APP_PATH/Info.plist")" = "$GITHUB_SHA"
          test "$(/usr/libexec/PlistBuddy -c 'Print EclipseMPVKitSourceRevision' "$APP_PATH/Info.plist")" = "$MPVKIT_SOURCE_REVISION"

          MANIFEST_PATH="$APP_PATH/PrivacyInfo.xcprivacy"
          if [[ ! -f "$MANIFEST_PATH" ]]; then
            echo "::error::PrivacyInfo.xcprivacy is missing from the iOS app bundle."
            exit 1
          fi
          plutil -lint "$MANIFEST_PATH" >/dev/null

          python3 - "$MANIFEST_PATH" <<'PY'
          import plistlib
          import sys

          manifest_path = sys.argv[1]
          with open(manifest_path, "rb") as handle:
              manifest = plistlib.load(handle)

          if manifest.get("NSPrivacyTracking") is not False:
              raise SystemExit("error: iOS privacy manifest must declare NSPrivacyTracking=false.")

          if manifest.get("NSPrivacyCollectedDataTypes") != []:
              raise SystemExit("error: iOS privacy manifest must contain an empty NSPrivacyCollectedDataTypes array.")

          required = {
              "NSPrivacyAccessedAPICategoryUserDefaults": {"CA92.1"},
              "NSPrivacyAccessedAPICategoryFileTimestamp": {"C617.1"},
              "NSPrivacyAccessedAPICategoryDiskSpace": {"85F4.1", "E174.1"},
              "NSPrivacyAccessedAPICategorySystemBootTime": {"35F9.1"},
          }
          declared = {
              entry.get("NSPrivacyAccessedAPIType"): set(entry.get("NSPrivacyAccessedAPITypeReasons", []))
              for entry in manifest.get("NSPrivacyAccessedAPITypes", [])
              if isinstance(entry, dict)
          }

          for category, reasons in required.items():
              missing = reasons - declared.get(category, set())
              if missing:
                  raise SystemExit(
                      f"error: iOS privacy manifest is missing {category} reason(s) {', '.join(sorted(missing))}."
                  )
          PY

          echo "iOS privacy manifest validation passed"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/$APP_NAME.xcarchive"
          PACKAGE_ROOT="$RUNNER_TEMP/unsigned-ipa"
          OUTPUT_DIR="$GITHUB_WORKSPACE/build"
          SAFE_APP_NAME="$(printf '%s' "$APP_NAME" | sed 's/[^A-Za-z0-9._+-]/-/g')"
          IPA_PATH="$OUTPUT_DIR/$SAFE_APP_NAME-unsigned.ipa"

          APP_PATH="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::No .app bundle found in archive."
            find "$ARCHIVE_PATH" -type d -name '*.app' 2>/dev/null || true
            exit 1
          fi

          rm -rf "$PACKAGE_ROOT" "$OUTPUT_DIR"
          mkdir -p "$PACKAGE_ROOT/Payload" "$OUTPUT_DIR"
          cp -R "$APP_PATH" "$PACKAGE_ROOT/Payload/$APP_NAME.app"

          rm -rf "$PACKAGE_ROOT/Payload/$APP_NAME.app/_CodeSignature"
          rm -f "$PACKAGE_ROOT/Payload/$APP_NAME.app/embedded.mobileprovision"

          if [ -f "$PACKAGE_ROOT/Payload/$APP_NAME.app/Eclipse" ]; then
            strip "$PACKAGE_ROOT/Payload/$APP_NAME.app/Eclipse" 2>/dev/null || true
          fi

          (
            cd "$PACKAGE_ROOT"
            zip -qry "$IPA_PATH" Payload
          )

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Eclipse-iOS-unsigned-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 1
