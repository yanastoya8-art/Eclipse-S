name: iOS Build and Tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: [main, feature/background-downloads-ios-cast-liquid-glass]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Only the newest commit on a PR/branch should consume a macOS runner.
# Cancel superseded builds so an obsolete MPVKit compile cannot block validation
# of the current source revision for an hour or more.
concurrency:
  group: ios-pr-build-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  prune-stale-ios-builds:
    name: Cancel superseded queued iOS builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel older queued builds for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "push" && "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Queue cleanup is limited to direct branch builds."
            exit 0
          fi
          if ! branch_head_sha="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$BRANCH_NAME" | awk 'NR == 1 { print $1 }')"; then
            echo "::warning::Could not verify branch HEAD; continuing without queue cleanup."
            exit 0
          fi
          if [[ -z "$branch_head_sha" ]]; then
            echo "::warning::Branch HEAD lookup returned no SHA; continuing without queue cleanup."
            exit 0
          fi
          if [[ "$branch_head_sha" != "$CURRENT_SHA" ]]; then
            echo "This run is stale; only the latest branch commit may prune queued builds."
            exit 0
          fi
          if ! stale_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ios-pr-build.yml --branch "$BRANCH_NAME" --limit 100 --json databaseId,status --jq '.[] | select(.status == "queued" or .status == "pending") | .databaseId')"; then
            echo "::warning::Could not list stale runs; continuing with the current build."
            exit 0
          fi
          while IFS= read -r run_id; do
            [[ -z "$run_id" || "$run_id" == "$CURRENT_RUN_ID" ]] && continue
            echo "Cancelling superseded queued run $run_id"
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || echo "::warning::Could not cancel stale run $run_id"
          done <<< "$stale_runs"

  ios-build-and-tests:
    name: Build and test iPhone/iPad app
    needs: prune-stale-ios-builds
    runs-on: macos-26-intel
    timeout-minutes: 180

    steps:
      - name: Checkout Eclipse
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Record Xcode version for build cache keys
        id: xcode-version
        run: |
          set -euo pipefail
          VERSION="$(xcodebuild -version | awk '/^Xcode / { print $2; exit }')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create local build config from repository secrets
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FANART_TV_API_KEY: ${{ secrets.FANART_TV_API_KEY }}
          ANIMESCHEDULE_API_TOKEN: ${{ secrets.ANIMESCHEDULE_API_TOKEN }}
          DUBSONLY_API_KEY: ${{ secrets.DUBSONLY_API_KEY }}
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          ANILIST_CLIENT_SECRET: ${{ secrets.ANILIST_CLIENT_SECRET }}
          ANILIST_REDIRECT_URI: ${{ secrets.ANILIST_REDIRECT_URI }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          MAL_REDIRECT_URI: ${{ secrets.MAL_REDIRECT_URI }}
        run: |
          set -euo pipefail
          {
            printf 'TMDB_API_KEY = %s\n' "${TMDB_API_KEY:-}"
            printf 'FANART_TV_API_KEY = %s\n' "${FANART_TV_API_KEY:-}"
            printf 'ANIMESCHEDULE_API_TOKEN = %s\n' "${ANIMESCHEDULE_API_TOKEN:-}"
            printf 'DUBSONLY_API_KEY = %s\n' "${DUBSONLY_API_KEY:-}"
            printf 'ANILIST_CLIENT_ID = %s\n' "${ANILIST_CLIENT_ID:-}"
            printf 'ANILIST_CLIENT_SECRET = %s\n' "${ANILIST_CLIENT_SECRET:-}"
            printf 'ANILIST_REDIRECT_URI = %s\n' "${ANILIST_REDIRECT_URI:-}"
            printf 'MAL_CLIENT_ID = %s\n' "${MAL_CLIENT_ID:-}"
            printf 'MAL_CLIENT_SECRET = %s\n' "${MAL_CLIENT_SECRET:-}"
            printf 'MAL_REDIRECT_URI = %s\n' "${MAL_REDIRECT_URI:-}"
          } > Build.local.xcconfig

      - name: Parse all iOS app and test Swift sources
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            swiftc -frontend -parse "$source"
          done < <(find Eclipse Kanzen Tests EclipseUITests -type f -name '*.swift' -print0)

      - name: Checkout pinned MPVKit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: yanastoya8-art/MPVKit-S
          ref: b951a22fc5ddbf708057ace059e3742dae685e4d
          path: MPVKit

      - name: Cache MPVKit build products and downloaded sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            MPVKit/.build
            MPVKit/dist
          key: mpvkit-${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode-version.outputs.version }}-b951a22fc5ddbf708057ace059e3742dae685e4d-ios-gpl-0.41.0-v1

      - name: Build patched MPVKit for iPhone and iPad
        run: |
          set -euo pipefail
          missing=()
          for formula in autoconf automake cmake libtool nasm ninja pkg-config; do
            if ! brew list --versions "$formula" >/dev/null 2>&1; then
              missing+=("$formula")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            brew install "${missing[@]}"
          else
            echo "All MPVKit build tools are already installed."
          fi
          MPVKIT_BUILD_VENV="$RUNNER_TEMP/mpvkit-build-venv"
          python3 -m venv "$MPVKIT_BUILD_VENV"
          "$MPVKIT_BUILD_VENV/bin/python" -m pip install --disable-pip-version-check meson==1.4.2
          export PATH="$MPVKIT_BUILD_VENV/bin:$PATH"
          MPVKIT_BUILD_SUCCEEDED=false
          for attempt in 1 2 3; do
            if make -C MPVKit build enable-gpl version=0.41.0 platform=ios; then
              MPVKIT_BUILD_SUCCEEDED=true
              break
            fi
          
            echo "::warning::MPVKit build attempt $attempt failed. Retrying transient upstream download failures."
            # Remove incomplete OpenSSL downloads so the next attempt starts cleanly.
            rm -rf MPVKit/dist/openssl-3.3.5 MPVKit/dist/openssl-3.3.5.log
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 10))"; fi
          done
          if [ "$MPVKIT_BUILD_SUCCEEDED" != true ]; then
            echo "::error::MPVKit did not build successfully after three attempts."
            exit 1
          fi
          test -f MPVKit/dist/release/Package.swift
          
      - name: Verify patched MPVKit source and local frameworks
        run: |
          set -euo pipefail
          test "$(git -C MPVKit rev-parse HEAD)" = "b951a22fc5ddbf708057ace059e3742dae685e4d"
          grep -q 'dovi_metadata' MPVKit/Sources/BuildScripts/patch/libmpv/0017-expose-decoded-dolby-vision-rpu.patch
          grep -q 'videoHasDolbyVisionRPU' MPVKit/Sources/MPVKitSampleBufferGPL/MPVGPUPlayerRenderer.swift

      - name: Cache SwiftPM repositories and binary artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/SourcePackages/repositories
            ${{ runner.temp }}/SourcePackages/artifacts
          key: swiftpm-${{ runner.os }}-xcode-${{ steps.xcode-version.outputs.version }}-${{ hashFiles('**/Package.resolved') }}-v1

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$RUNNER_TEMP/SourcePackages"
          xcodebuild -resolvePackageDependencies \
            -project Eclipse.xcodeproj \
            -scheme Eclipse \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -skipPackagePluginValidation \
            -skipMacroValidation

          # The MPVKit manifest searches its package root and package-root/xcframework.
          # Stage the unpacked XCFrameworks at that exact location (not under dist/release),
          # then point the manifest at the package root itself.
          MPVKIT_PACKAGE_CHECKOUT="$SOURCE_PACKAGES_DIR/checkouts/mpvkit-s"
          test -f "$MPVKIT_PACKAGE_CHECKOUT/Package.swift"
          test "$(git -C "$MPVKIT_PACKAGE_CHECKOUT" rev-parse HEAD)" = "b951a22fc5ddbf708057ace059e3742dae685e4d"
          MPVKIT_LOCAL_ARTIFACTS_DIR="$MPVKIT_PACKAGE_CHECKOUT"
          export MPVKIT_LOCAL_ARTIFACTS_DIR
          mkdir -p "$MPVKIT_LOCAL_ARTIFACTS_DIR/xcframework"
          rsync -a MPVKit/dist/release/xcframework/ "$MPVKIT_LOCAL_ARTIFACTS_DIR/xcframework/"
          # MPVKit does not build MoltenVK and Libplacebo XCFramework bundles in
          # this iOS CI build. Keep those two targets on their checksum-pinned
          # upstream binary artifacts; use the locally rebuilt runtime for the
          # libmpv and FFmpeg frameworks that this job actually produces.
          python3 - <<'PY'
          import os
          from pathlib import Path
          manifest = Path(os.environ["MPVKIT_LOCAL_ARTIFACTS_DIR"]) / "Package.swift"
          # SwiftPM git checkouts are read-only; make this CI-only manifest copy writable.
          manifest.chmod(0o644)
          source = manifest.read_text()
          start = source.index("    let requiredArtifacts = [")
          end = source.index("\n    ]", start) + len("\n    ]")
          replacement = """    let requiredArtifacts = [
                  "Libmpv", "Libavcodec", "Libavdevice", "Libavfilter",
                  "Libavformat", "Libavutil", "Libswresample", "Libswscale",
              ]"""
          manifest.write_text(source[:start] + replacement + source[end:])
          PY

          # Fail here with a useful diagnostic instead of letting Package.swift abort
          # package graph evaluation with the generic exit-74 fatal error.
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          root = Path(os.environ["MPVKIT_LOCAL_ARTIFACTS_DIR"])
          required = (
              "Libmpv", "Libavcodec", "Libavdevice",
              "Libavfilter", "Libavformat", "Libavutil", "Libswresample", "Libswscale",
          )
          failures = []
          for name in required:
              artifact = root / "xcframework" / f"{name}.xcframework"
              info = artifact / "Info.plist"
              if artifact.is_symlink() or not artifact.is_dir() or info.is_symlink() or not info.is_file():
                  failures.append(f"{name}: missing/non-regular XCFramework or Info.plist at {artifact}")
                  continue
              try:
                  libraries = plistlib.loads(info.read_bytes())["AvailableLibraries"]
              except Exception as error:
                  failures.append(f"{name}: invalid Info.plist: {error}")
                  continue
              device = any(
                  item.get("SupportedPlatform") == "ios"
                  and item.get("SupportedPlatformVariant") is None
                  and "arm64" in item.get("SupportedArchitectures", [])
                  for item in libraries
              )
              simulator = any(
                  item.get("SupportedPlatform") == "ios"
                  and item.get("SupportedPlatformVariant") == "simulator"
                  and "arm64" in item.get("SupportedArchitectures", [])
                  for item in libraries
              )
              if not device or not simulator:
                  failures.append(f"{name}: missing iOS arm64 device/simulator slices; libraries={libraries}")
          if failures:
              raise SystemExit("\\n".join(failures))
          print(f"Validated {len(required)} iOS device + Apple-silicon simulator XCFrameworks in {root}")
          PY

          export MPVKIT_LOCAL_ARTIFACTS_DIR
          xcodebuild -resolvePackageDependencies \
            -project Eclipse.xcodeproj \
            -scheme Eclipse \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -skipPackagePluginValidation \
            -skipMacroValidation
          echo "SOURCE_PACKAGES_DIR=$SOURCE_PACKAGES_DIR" >> "$GITHUB_ENV"
          echo "MPVKIT_LOCAL_ARTIFACTS_DIR=$MPVKIT_LOCAL_ARTIFACTS_DIR" >> "$GITHUB_ENV"

      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d["isAvailable"] and d["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available iPhone simulator was found."
            exit 1
          fi
          echo "SIMULATOR_UDID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true

      - name: Build and run iOS unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Eclipse.xcodeproj \
            -scheme Eclipse \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO
