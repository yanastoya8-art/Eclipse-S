name: iOS Build and Tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: [main, feature/background-downloads-ios-cast-liquid-glass]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Every run gets a slot for its lightweight queue-cleanup job. The latest
# branch-head run cancels older queued and in-progress builds for that branch.
concurrency:
  group: ios-pr-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prune-stale-ios-builds:
    name: Cancel superseded queued iOS builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel older queued builds for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "push" && "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Queue cleanup is limited to direct branch builds."
            exit 0
          fi
          if ! branch_head_sha="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$BRANCH_NAME" | awk 'NR == 1 { print $1 }')"; then
            echo "::warning::Could not verify branch HEAD; continuing without queue cleanup."
            exit 0
          fi
          if [[ -z "$branch_head_sha" ]]; then
            echo "::warning::Branch HEAD lookup returned no SHA; continuing without queue cleanup."
            exit 0
          fi
          if [[ "$branch_head_sha" != "$CURRENT_SHA" ]]; then
            echo "This run is stale; only the latest branch commit may prune queued builds."
            exit 0
          fi
          if ! stale_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ios-pr-build.yml --branch "$BRANCH_NAME" --limit 100 --json databaseId,status --jq '.[] | select(.status == "queued" or .status == "pending" or .status == "in_progress") | .databaseId')"; then
            echo "::warning::Could not list stale runs; continuing with the current build."
            exit 0
          fi
          while IFS= read -r run_id; do
            [[ -z "$run_id" || "$run_id" == "$CURRENT_RUN_ID" ]] && continue
            echo "Cancelling superseded queued/in-progress run $run_id"
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || echo "::warning::Could not cancel stale run $run_id"
          done <<< "$stale_runs"

  ios-build-and-tests:
    name: Build and test iPhone/iPad app
    needs: prune-stale-ios-builds
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout Eclipse
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Parse all iOS app and test Swift sources
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            swiftc -frontend -parse "$source"
          done < <(find Eclipse Kanzen Tests EclipseUITests -type f -name '*.swift' -print0)

      - name: Checkout pinned MPVKit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: yanastoya8-art/MPVKit-S
          ref: fee7aa27869ed4775ff2984de4438484d902e67b
          path: MPVKit

      - name: Build patched MPVKit for iPhone and iPad
        run: |
          set -euo pipefail
          brew install autoconf automake cmake libtool nasm ninja pkg-config
          MPVKIT_BUILD_VENV="$RUNNER_TEMP/mpvkit-build-venv"
          python3 -m venv "$MPVKIT_BUILD_VENV"
          "$MPVKIT_BUILD_VENV/bin/python" -m pip install --disable-pip-version-check meson==1.4.2
          export PATH="$MPVKIT_BUILD_VENV/bin:$PATH"
          make -C MPVKit build enable-gpl version=0.41.0 platform=ios
          test -f MPVKit/dist/release/Package.swift
          
      - name: Verify patched MPVKit source and local frameworks
        run: |
          set -euo pipefail
          test "$(git -C MPVKit rev-parse HEAD)" = "fee7aa27869ed4775ff2984de4438484d902e67b"
          grep -q 'dovi_metadata' MPVKit/Sources/BuildScripts/patch/libmpv/0017-expose-decoded-dolby-vision-rpu.patch
          grep -q 'videoHasDolbyVisionRPU' MPVKit/Sources/MPVKitSampleBufferGPL/MPVGPUPlayerRenderer.swift

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$RUNNER_TEMP/SourcePackages"
          xcodebuild -resolvePackageDependencies \
            -project Eclipse.xcodeproj \
            -scheme Eclipse \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -skipPackagePluginValidation \
            -skipMacroValidation

          # The MPVKit manifest searches its package root and package-root/xcframework.
          # Stage the unpacked XCFrameworks at that exact location (not under dist/release),
          # then point the manifest at the package root itself.
          MPVKIT_PACKAGE_CHECKOUT="$SOURCE_PACKAGES_DIR/checkouts/mpvkit-s"
          test -f "$MPVKIT_PACKAGE_CHECKOUT/Package.swift"
          test "$(git -C "$MPVKIT_PACKAGE_CHECKOUT" rev-parse HEAD)" = "fee7aa27869ed4775ff2984de4438484d902e67b"
          MPVKIT_LOCAL_ARTIFACTS_DIR="$MPVKIT_PACKAGE_CHECKOUT"
          export MPVKIT_LOCAL_ARTIFACTS_DIR
          mkdir -p "$MPVKIT_LOCAL_ARTIFACTS_DIR/xcframework"
          rsync -a MPVKit/dist/release/xcframework/ "$MPVKIT_LOCAL_ARTIFACTS_DIR/xcframework/"
          # MPVKit does not build MoltenVK and Libplacebo XCFramework bundles in
          # this iOS CI build. Keep those two targets on their checksum-pinned
          # upstream binary artifacts; use the locally rebuilt runtime for the
          # libmpv and FFmpeg frameworks that this job actually produces.
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("$MPVKIT_LOCAL_ARTIFACTS_DIR/Package.swift")
          source = manifest.read_text()
          old = '"Libmpv", "MoltenVK", "Libplacebo", "Libavcodec"'
          new = '"Libmpv", "Libavcodec"'
          if source.count(old) != 1:
              raise SystemExit("Could not safely narrow MPVKit local artifact validation")
          manifest.write_text(source.replace(old, new, 1))
          PY

          # Fail here with a useful diagnostic instead of letting Package.swift abort
          # package graph evaluation with the generic exit-74 fatal error.
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          root = Path(os.environ["MPVKIT_LOCAL_ARTIFACTS_DIR"])
          required = (
              "Libmpv", "Libavcodec", "Libavdevice",
              "Libavfilter", "Libavformat", "Libavutil", "Libswresample", "Libswscale",
          )
          failures = []
          for name in required:
              artifact = root / "xcframework" / f"{name}.xcframework"
              info = artifact / "Info.plist"
              if artifact.is_symlink() or not artifact.is_dir() or info.is_symlink() or not info.is_file():
                  failures.append(f"{name}: missing/non-regular XCFramework or Info.plist at {artifact}")
                  continue
              try:
                  libraries = plistlib.loads(info.read_bytes())["AvailableLibraries"]
              except Exception as error:
                  failures.append(f"{name}: invalid Info.plist: {error}")
                  continue
              device = any(
                  item.get("SupportedPlatform") == "ios"
                  and item.get("SupportedPlatformVariant") is None
                  and "arm64" in item.get("SupportedArchitectures", [])
                  for item in libraries
              )
              simulator = any(
                  item.get("SupportedPlatform") == "ios"
                  and item.get("SupportedPlatformVariant") == "simulator"
                  and "arm64" in item.get("SupportedArchitectures", [])
                  for item in libraries
              )
              if not device or not simulator:
                  failures.append(f"{name}: missing iOS arm64 device/simulator slices; libraries={libraries}")
          if failures:
              raise SystemExit("\\n".join(failures))
          print(f"Validated {len(required)} iOS device + Apple-silicon simulator XCFrameworks in {root}")
          PY

          export MPVKIT_LOCAL_ARTIFACTS_DIR
          xcodebuild -resolvePackageDependencies \
            -project Eclipse.xcodeproj \
            -scheme Eclipse \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -skipPackagePluginValidation \
            -skipMacroValidation
          echo "SOURCE_PACKAGES_DIR=$SOURCE_PACKAGES_DIR" >> "$GITHUB_ENV"
          echo "MPVKIT_LOCAL_ARTIFACTS_DIR=$MPVKIT_LOCAL_ARTIFACTS_DIR" >> "$GITHUB_ENV"

      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d["isAvailable"] and d["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available iPhone simulator was found."
            exit 1
          fi
          echo "SIMULATOR_UDID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true

      - name: Build and run iOS unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Eclipse.xcodeproj \
            -scheme Eclipse \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO
